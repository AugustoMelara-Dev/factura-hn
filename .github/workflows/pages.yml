# Sitio de documentación en GitHub Pages.
#
# Apagado hasta que el responsable active Pages (origen: GitHub Actions) y la variable PUBLICAR_SITIO = "true"
# (ver docs/lanzamiento.md).
name: Sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    if: vars.PUBLICAR_SITIO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Sin las dependencias de colecciones/ (CLI de Bruno): solo las usa el trabajo «colecciones» de ci.yml.
      - run: pnpm install --frozen-lockfile --filter '!@factura-hn/colecciones'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - run: pnpm --filter factura-hn build
      # Astro Starlight (web/): genera las páginas, construye en sitio/ y verifica la matriz, los enlaces y anclas,
      # el buscador y los recursos para IA. La URL y la base salen de la configuración de Pages.
      - run: pnpm sitio
        env:
          FHN_SITIO_URL: ${{ steps.pages.outputs.origin }}
          FHN_SITIO_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: sitio

  publicar:
    needs: construir
    # Solo desde main: workflow_dispatch puede lanzarse desde otra rama.
    if: vars.PUBLICAR_SITIO == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

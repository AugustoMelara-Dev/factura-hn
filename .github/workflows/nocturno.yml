# Mediciones largas: lo que tarda más de unos 2 minutos y no cabe en ci.yml. Cada noche y a mano.
# Las acciones van fijadas por SHA (con la versión en el comentario), como en ci.yml.
# Un trabajo por tema; cada uno con su informe en docs/calidad/.
name: Nocturno

on:
  schedule:
    - cron: '0 7 * * *' # 01:00 en Honduras (UTC-6)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nocturno-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Sección: propiedades, contrato OpenAPI y fuzzing ──────────────────────────────────────────
  # El CI corre lo mismo con 200 casos por propiedad y 300 casos de fuzz de la API; aquí, 20 000 de cada uno.
  # El fuzz del CI usa una semilla fija; aquí cambia cada noche. Un fallo imprime la semilla de fast-check:
  # FHN_PROP_SEMILLA=<semilla> lo reproduce (docs/calidad/propiedades.md).
  propiedades:
    name: Propiedades, contrato OpenAPI y fuzzing (20 000 casos)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: factura_hn_pruebas
          # Solo en el contenedor efímero del CI.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TZ: UTC
      FHN_PG_URL: postgres://postgres@localhost:5432/factura_hn_pruebas
      FHN_PROP_CORRIDAS: '20000'
      FHN_FUZZ_CASOS: '20000'
      # Una semilla distinta cada noche (el CI usa una fija). Un fallo se reproduce con la que imprime fast-check.
      FHN_PROP_SEMILLA: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@factura-hn/colecciones'
      - run: pnpm build
      - name: Propiedades del núcleo, contrato de cada respuesta de la API y fuzz
        run: pnpm calidad:propiedades
  # ── Fin de la sección propiedades ─────────────────────────────────────────────────────────────────────────────────

  # --- Carga y resiliencia -------------------------------------------------------------
  carga-y-resiliencia:
    name: Carga larga (5 min, 64 conexiones, 16 cajas) y resiliencia larga
    runs-on: ubuntu-latest
    # 10 min de carga, hasta 15 min para vaciar la cola de webhooks y la resiliencia larga.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: factura_hn_pruebas
          # Solo en el contenedor efímero del CI.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TZ: UTC
      FHN_PG_URL: postgres://postgres@localhost:5432/factura_hn_pruebas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@factura-hn/colecciones'
      - run: pnpm build
      - name: 'Carga larga: latencia a 30/s, saturación con 64 conexiones, numeración, idempotencia y webhooks'
        run: pnpm carga nocturno
      - name: 'Resiliencia larga: 5 reinicios y 5 caídas de PostgreSQL con tráfico, webhooks caídos con más avisos'
        # Clúster desechable con los binarios de PostgreSQL del runner; el servicio de arriba no se reinicia.
        run: pnpm resiliencia --larga
  # --- fin de carga y resiliencia ---------------------------------------------------------------------------

  # --- Sección: pruebas de mutación del núcleo (docs/calidad/mutacion.md) ---
  mutacion:
    name: Mutación del núcleo (Stryker, ≥ 85 % por módulo)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@factura-hn/colecciones'
      # Falla si el puntaje global baja de 85 % (thresholds.break) o si algún módulo baja de 85 %.
      - name: Stryker sobre cálculo, dinero, letras, numeración y validación
        run: pnpm mutacion
      - name: Informe HTML y JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutacion
          path: packages/core/reports/mutacion/
          retention-days: 14
  # --- Fin de la sección de mutación ---

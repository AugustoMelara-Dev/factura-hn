# Publicación en npm con changesets y procedencia (npm provenance).
#
# Apagado hasta que el responsable lo active: corre solo si la variable del repositorio PUBLICAR_NPM vale
# "true" (ver docs/lanzamiento.md). Con changesets pendientes abre o actualiza el PR «Versión de paquetes»;
# al fusionar ese PR (sin changesets pendientes) publica las versiones que aún no están en npm.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: vars.PUBLICAR_NPM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write # commit y etiquetas del PR de versión
      pull-requests: write # abrir el PR de versión
      id-token: write # firma de procedencia (OIDC de GitHub)
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm auditar:datos
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/verificar-dist.mjs
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          title: 'Versión de paquetes'
          commit: 'chore: versión de paquetes'
          version: pnpm changeset version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

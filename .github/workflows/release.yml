# Publicación en npm con changesets y publicación de confianza (trusted publishing, OIDC).
#
# Apagado hasta que el responsable lo active: corre solo en main y si la variable del repositorio PUBLICAR_NPM vale
# "true" (ver docs/lanzamiento.md). Tres trabajos, cada uno con solo los permisos que usa:
# - verificar: instala, compila y prueba, sin permisos de escritura ni OIDC. Guarda los dist/ compilados y dice si
#   alguna versión de package.json aún no está en npm.
# - version: con changesets pendientes, abre o actualiza el PR «Versión de paquetes» (`pnpm run version`).
# - publicar: sin changesets pendientes y con algo que publicar (al fusionar ese PR), sube a npm los dist/ que
#   verificó el primer trabajo. Solo este usa el entorno npm (aprobación del responsable) y el token OIDC, y no
#   instala dependencias: ningún script de instalación corre con permiso de publicar.
#
# Sin tokens ni secretos de npm: npm (>= 11.5.1) cambia el token OIDC de GitHub por una credencial de un solo
# uso y firma la procedencia. Cada paquete tiene en npmjs.com un «Trusted Publisher» con este repositorio, el
# archivo release.yml y el entorno npm; si cambia el nombre de este archivo o del entorno, deja de publicar.
#
# El PR de versión lo abre GITHUB_TOKEN, y GitHub no dispara flujos con los eventos de ese token: el PR no corre
# el CI por sí solo. Ver docs/lanzamiento.md, paso 6.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verificar:
    if: vars.PUBLICAR_NPM == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TZ: UTC
    outputs:
      pendientes: ${{ steps.pendientes.outputs.pendientes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # la auditoría de datos revisa los correos de todo el historial
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # Sin las dependencias de colecciones/ (CLI de Bruno): solo las usa el trabajo «colecciones» de ci.yml.
      - run: pnpm install --frozen-lockfile --filter '!@factura-hn/colecciones'
      - run: pnpm auditar:datos
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/verificar-dist.mjs
      - name: ¿Hay versiones que aún no están en npm?
        id: pendientes
        run: node scripts/publicar.mjs --pendientes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 7

  version:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # rama y commit del PR de versión
      pull-requests: write # abrir el PR de versión
    outputs:
      hay-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # changesets/action sube el commit con la API de GitHub y su github-token
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter '!@factura-hn/colecciones'
      # Sin publish-script: con changesets pendientes abre o actualiza el PR; sin ellos no hace nada y deja
      # has-changesets en false para el trabajo «publicar».
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'Versión de paquetes'
          commit-message: 'chore: versión de paquetes'
          version-script: pnpm run version

  publicar:
    needs: [verificar, version]
    if: >-
      vars.PUBLICAR_NPM == 'true' && github.ref == 'refs/heads/main' &&
      needs.version.outputs.hay-changesets == 'false' && needs.verificar.outputs.pendientes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write # etiquetas y releases de GitHub
      id-token: write # publicación de confianza y procedencia (OIDC de GitHub)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # las etiquetas se crean con la API de GitHub
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # Node fijado a una versión exacta: su npm viene en la misma descarga (24.22.3 trae npm 11.19.1; la
      # publicación de confianza pide >= 11.5.1 y scripts/publicar.mjs lo comprueba). Así no se instala otro npm
      # desde el registro (`npm install -g npm@…`) en el trabajo que tiene el token OIDC. Al subir esta versión,
      # revisa la columna npm de https://nodejs.org/dist/index.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org
      - run: npm --version
      # Lo compilado y probado en «verificar». pnpm pack no necesita node_modules: aquí no se instala nada.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: packages
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Empaqueta con pnpm y sube con npm (scripts/publicar.mjs): npm hace el intercambio OIDC. publicar.mjs
          # escribe en CHANGESETS_OUTPUT las etiquetas, y la acción crea cada etiqueta y su release en GitHub.
          publish-script: node scripts/publicar.mjs
        env:
          # Procedencia explícita. Va solo aquí, no en publishConfig: la publicación manual no tiene OIDC.
          NPM_CONFIG_PROVENANCE: 'true'

name: Regla fiscal
description: Una regla del SAR que falta, sobra o se interpreta mal.
labels: [regla-fiscal]
body:
  - type: markdown
    attributes:
      value: |
        factura-hn no inventa reglas: cada una cita su artículo. Ayúdanos con la fuente exacta.
  - type: input
    id: articulo
    attributes:
      label: Artículo y norma
      placeholder: Reglamento del Régimen de Facturación (Acuerdo 481-2017), Art. 10 num. 1
    validations:
      required: true
  - type: textarea
    id: texto
    attributes:
      label: Qué dice la norma
      description: Cita breve o resumen, con enlace a la publicación oficial (La Gaceta, sar.gob.hn).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Qué hace factura-hn hoy
      description: Si aplica, la fila de docs/investigacion.md o la decisión de docs/decisiones.md.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Qué debería hacer
  - type: dropdown
    id: fuente
    attributes:
      label: ¿De dónde sale la interpretación?
      options: [Texto de la norma, Respuesta escrita del SAR, Criterio de un contador, Otra]
    validations:
      required: true

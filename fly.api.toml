# API de la demostración pública en Fly.io (FHN_MODO=demo). Guía paso a paso: docs/despliegue-demo.md.
#   fly deploy -c fly.api.toml --ha=false        (desde la raíz del repositorio; una sola máquina)
# Los secretos (DATABASE_URL, FHN_DEMO_SECRETO, SUPABASE_CA, FHN_PROXIES_DE_CONFIANZA) van con `fly secrets import`,
# nunca aquí. La credencial del dueño de la base (FHN_MIGRAR_URL) NO va a Fly: la migración corre aparte, antes de
# desplegar, con `node packages/api/dist/cli.js migrar` (ver docs/despliegue-demo.md). Cambia el nombre de la
# aplicación si ya está tomado y, con él, las URL de [env] y FHN_API_URL de fly.mcp.toml.
app = "factura-hn-demo-api"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile.api"

[env]
  FHN_MODO = "demo"
  # Atiende solo con el rol de la API (DATABASE_URL = fhn_api): no migra ni tiene credenciales de dueño. Al arrancar
  # exige que el esquema esté al día y que DATABASE_URL no sea dueño, superusuario ni BYPASSRLS.
  FHN_MIGRAR_AL_ARRANCAR = "0"
  PUERTO = "8787"
  # «::» escucha en IPv6 y en IPv4: la red privada de Fly (<app>.internal, por donde llama el MCP remoto) es
  # solo IPv6, y el proxy público llega por IPv4.
  FHN_HOST = "::"
  # El proxy de Fly pone aquí la dirección de cada visitante (y la reemplaza si el cliente la manda).
  FHN_IP_CLIENTE_CABECERA = "Fly-Client-IP"
  FHN_DEMO_ORIGENES = "https://augustomelara-dev.github.io"
  # URL públicas para los ejemplos de cada entorno nuevo. Con un dominio propio, cámbialas aquí.
  FHN_DEMO_URL_API = "https://factura-hn-demo-api.fly.dev"
  FHN_DEMO_URL_MCP = "https://factura-hn-demo-mcp.fly.dev/mcp"
  # Cómo se ve la consola en los mensajes de la API: se corre desde un clon del repositorio, con el dueño.
  FHN_CONSOLA = "node packages/api/dist/cli.js"
  # Por debajo de los 512 MB de la máquina: Node libera memoria antes de que el sistema mate el proceso.
  NODE_OPTIONS = "--max-old-space-size=384"
  # Los límites FHN_DEMO_* quedan en sus valores por defecto (docs/demo.md): son estrictos a propósito.

# Certificado de la autoridad de Supabase (secreto SUPABASE_CA, en base64): las URL de la base lo usan con
# sslmode=verify-full&sslrootcert=/app/supabase-ca.crt. Ver «Secretos» en docs/despliegue-demo.md.
[[files]]
  guest_path = "/app/supabase-ca.crt"
  secret_name = "SUPABASE_CA"

[http_service]
  internal_port = 8787
  force_https = true
  # Siempre encendida: una sola máquina, sin apagarla cuando no hay tráfico ni crear más.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/salud"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# factura-hn local: API + PostgreSQL en el establecimiento del negocio (Art. 47).
#   docker compose up -d --build --wait
# La consola del operador se invoca con `docker compose exec api factura-hn-api <comando>` (ayuda: … ayuda).
# La llave admin de tu negocio (tenant «local») no sale en el log: créala en tu terminal con
#   docker compose exec api factura-hn-api llave crear local --rol admin --nombre Administración
# Las llaves del demo (CAI ficticio, sin validez fiscal) salen una vez en el log (docker compose logs api); otra
# llave de caja del demo: docker compose exec api factura-hn-api demo llave
# La API escucha solo en 127.0.0.1:8787 (otro puerto: FHN_PUERTO=8788 docker compose up …). Postgres no publica
# su puerto: solo la API lo alcanza, por la red interna de Compose (sin contraseñas en el repo). Para desarrollo
# y pruebas, docker-compose.dev.yml publica la base en 127.0.0.1:54329. Para producción usa contraseñas y TLS
# (ver docs/autoalojamiento.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: factura_hn
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d factura_hn"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Vuelve a arrancar si el proceso termina (también tras reiniciar Docker o el equipo).
    restart: unless-stopped
    environment:
      # La API corre como fhn_api: un rol LOGIN que no es dueño de las tablas ni superusuario. Al arrancar, la
      # migración lo crea (sin contraseña: dentro de Compose rige trust) y le concede el rol de la aplicación.
      # Con contraseñas (docker-compose.override.yml), define las DOS URL, cada una con su contraseña, y crea
      # fhn_api con la suya antes: ver «Poner en marcha un negocio» y «Actualizar» en docs/autoalojamiento.md.
      DATABASE_URL: postgres://fhn_api@db:5432/factura_hn
      # Dueño de las tablas: solo para migrar y preparar el modo local al arrancar, y para la consola (factura-hn-api).
      # Debe ser otro usuario que el de DATABASE_URL; si no, la API no arranca.
      FHN_MIGRAR_URL: postgres://postgres@db:5432/factura_hn
      FHN_MODO: local
      # Tenant «demo» aparte, con CAI FICTICIO (sin validez fiscal). El tenant «local» del negocio queda limpio.
      # Pon "0" en un negocio real para no crearlo.
      FHN_DEMO: "1"
    ports:
      - "127.0.0.1:${FHN_PUERTO:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos:

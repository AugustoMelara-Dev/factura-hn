# factura-hn local: API + PostgreSQL en el establecimiento del negocio (Art. 47).
#   docker compose up -d --build --wait
# La consola del operador se invoca con `docker compose exec api factura-hn-api <comando>` (ayuda: … ayuda).
# La llave admin de tu negocio (tenant «local») no sale en el log: créala en tu terminal con
#   docker compose exec api factura-hn-api llave crear local --rol admin --nombre Administración
# Las llaves del demo (CAI ficticio, sin validez fiscal) salen una vez en el log (docker compose logs api); otra
# llave de caja del demo: docker compose exec api factura-hn-api demo llave
# La API escucha solo en 127.0.0.1:8787 (otro puerto: FHN_PUERTO=8788 docker compose up …). Postgres no publica
# su puerto: solo la API lo alcanza, por la red interna de Compose (sin contraseñas en el repo). Para desarrollo
# y pruebas, docker-compose.dev.yml publica la base en 127.0.0.1:54329. Para producción usa contraseñas y TLS
# (ver docs/autoalojamiento.md).
#
# Por qué `trust` aquí (sin contraseña): la base no publica ningún puerto y solo la alcanzan los contenedores de
# este proyecto, en su red interna; la API solo escucha en 127.0.0.1. Quien puede llegar a la base ya puede correr
# `docker compose exec` en este equipo, y con eso entraría igual con o sin contraseña. Así `docker compose up -d
# --build --wait` funciona sin crear nada antes. Por la misma razón FHN_MIGRAR_URL se queda en el entorno de la API:
# con trust, quitarla no le quita a ese proceso el acceso como dueño. Lo que sí protege: la API atiende como
# fhn_api (sin permisos de dueño ni BYPASSRLS) y cierra la conexión del dueño al terminar de migrar. En un equipo
# compartido o en un servidor, pasa a contraseñas con un docker-compose.override.yml y un .env que no se versiona
# (docs/autoalojamiento.md, «Contraseña de la base»): ahí DATABASE_URL lleva la de fhn_api y la del dueño queda solo
# en FHN_MIGRAR_URL. Ni .env ni docker-compose.override.yml entran en la imagen (.dockerignore).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: factura_hn
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - datos:/var/lib/postgresql/data
      # Solo corre al crear la base en un volumen nuevo: con FHN_API_PASSWORD (override con contraseñas), crea fhn_api.
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP y no por el socket: mientras se crea la base, Postgres arranca un servidor temporal que solo
      # escucha en el socket. Así «sano» quiere decir que ya acepta conexiones de verdad.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d factura_hn"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # Vuelve a arrancar si el proceso termina (también tras reiniciar Docker o el equipo).
    restart: unless-stopped
    environment:
      # La API corre como fhn_api: un rol LOGIN que no es dueño de las tablas ni superusuario. Al arrancar, la
      # migración lo crea (sin contraseña: dentro de Compose rige trust) y le concede el rol de la aplicación.
      # Con contraseñas (docker-compose.override.yml), define las DOS URL, cada una con su contraseña, y
      # FHN_API_PASSWORD en el servicio db (scripts/db-init crea fhn_api): ver docs/autoalojamiento.md.
      DATABASE_URL: postgres://fhn_api@db:5432/factura_hn
      # Dueño de las tablas: solo para migrar y preparar el modo local al arrancar, y para la consola (factura-hn-api).
      # Debe ser otro usuario que el de DATABASE_URL; si no, la API no arranca.
      FHN_MIGRAR_URL: postgres://postgres@db:5432/factura_hn
      FHN_MODO: local
      # Tenant «demo» aparte, con CAI FICTICIO (sin validez fiscal). El tenant «local» del negocio queda limpio.
      # Pon "0" en un negocio real para no crearlo.
      FHN_DEMO: "1"
      # Solo para que el log al arrancar dé la URL exacta en tu equipo (adentro el proceso escucha en 8787).
      FHN_PUERTO: ${FHN_PUERTO:-8787}
    ports:
      - "127.0.0.1:${FHN_PUERTO:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos:

# Servicios locales de desarrollo. La Fase 2 agrega la API.
# Postgres solo escucha en 127.0.0.1 y confía en las conexiones locales: no hay contraseñas en el repo.
# No uses esta configuración en producción.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factura_hn
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d factura_hn"]
      interval: 2s
      timeout: 3s
      retries: 30

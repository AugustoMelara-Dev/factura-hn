# factura-hn local: API + PostgreSQL en el establecimiento del negocio (Art. 47).
#   docker compose up --build
# Al primer arranque la API imprime las llaves (admin y caja) una sola vez: docker compose logs api
# Postgres y la API solo escuchan en 127.0.0.1. Postgres confía en las conexiones de la red interna de
# Compose: no hay contraseñas en el repo. Para producción usa contraseñas y TLS (ver docs/api.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factura_hn
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d factura_hn"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://postgres@db:5432/factura_hn
      FHN_MODO: local
      # Datos de demostración con CAI FICTICIO (no válido para facturar). Quita esta línea en un negocio real.
      FHN_DEMO: "1"
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos:
